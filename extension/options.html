<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenDM Extension Options</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; background: #1a1e24; color: #ddd; }
    h2 { margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #aaa; }
    code { color: #7dd3fc; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; background: #262c36; border: 1px solid #3d4654; color: #fff; border-radius: 4px; font-family: monospace; }
    button { margin-top: 12px; padding: 8px 16px; background: #2f7cf6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    label.row { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 14px; }
    #status { margin-top: 10px; font-size: 13px; color: #4ade80; min-height: 18px; }
  </style>
</head>
<body>
  <h2>OpenDM Configuration</h2>
  <p>Paste the API token from <code>~/.config/opendm/daemon.json</code> (Windows: <code>%userprofile%\.config\opendm\daemon.json</code>):</p>
  <input type="text" id="token" placeholder="64-character hex token">
  <label class="row">
    <input type="checkbox" id="autocatch">
    <span>Auto-catch browser downloads (intercept and redirect to OpenDM)</span>
  </label>
  <button id="save">Save</button>
  <div id="status"></div>
  <script>
    const tokenInput = document.getElementById("token");
    const autoCatch = document.getElementById("autocatch");
    const statusDiv = document.getElementById("status");
    chrome.storage.local.get(["opendm_token", "opendm_autocatch"], res => {
      if (res.opendm_token) tokenInput.value = res.opendm_token;
      autoCatch.checked = !!res.opendm_autocatch;
    });
    document.getElementById("save").addEventListener("click", () => {
      chrome.storage.local.set({
        opendm_token: tokenInput.value.trim(),
        opendm_autocatch: autoCatch.checked
      }, () => {
        statusDiv.textContent = "Saved.";
        setTimeout(() => statusDiv.textContent = "", 2500);
      });
    });
  </script>
</body>
</html>
