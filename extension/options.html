<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenDM Extension Options</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; background: #1a1e24; color: #ddd; }
    h2 { margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #aaa; }
    code { color: #7dd3fc; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; background: #262c36; border: 1px solid #3d4654; color: #fff; border-radius: 4px; font-family: monospace; }
    button { margin-top: 12px; padding: 8px 16px; background: #2f7cf6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button.pair { background: #16a34a; }
    label.row { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 14px; }
    #status { margin-top: 10px; font-size: 13px; color: #4ade80; min-height: 18px; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>OpenDM Configuration</h2>
  <p>Pair with the OpenDM app (easiest): click <b>Pair now</b>, then click <b>Pair</b> in the app window within 2 minutes.</p>
  <button class="pair" id="pair">Pair now</button>
  <span class="hint">The app must be running and its pairing window open.</span>
  <p style="margin-top:24px">…or paste the API token manually from <code>~/.config/opendm/daemon.json</code>:</p>
  <input type="text" id="token" placeholder="64-character hex token">
  <label class="row">
    <input type="checkbox" id="autocatch">
    <span>Auto-catch browser downloads (intercept and redirect to OpenDM)</span>
  </label>
  <button id="save">Save</button>
  <div id="status"></div>
  <script>
    const tokenInput = document.getElementById("token");
    const autoCatch = document.getElementById("autocatch");
    const statusDiv = document.getElementById("status");
    const flash = (msg, ok = true) => {
      statusDiv.textContent = msg;
      statusDiv.style.color = ok ? "#4ade80" : "#f87171";
      setTimeout(() => statusDiv.textContent = "", 4000);
    };
    chrome.storage.local.get(["opendm_token", "opendm_autocatch"], res => {
      if (res.opendm_token) tokenInput.value = res.opendm_token;
      autoCatch.checked = !!res.opendm_autocatch;
    });
    document.getElementById("save").addEventListener("click", () => {
      chrome.storage.local.set({
        opendm_token: tokenInput.value.trim(),
        opendm_autocatch: autoCatch.checked
      }, () => flash("Saved."));
    });
    document.getElementById("pair").addEventListener("click", async () => {
      try {
        const res = await fetch("http://127.0.0.1:10010/api/v1/pair");
        const data = await res.json();
        if (res.ok && data.ok) {
          tokenInput.value = data.token;
          await chrome.storage.local.set({ opendm_token: data.token });
          flash("Paired! Token stored.");
        } else {
          flash(data.error || "Pairing refused", false);
        }
      } catch (e) {
        flash("App unreachable — is OpenDM running?", false);
      }
    });
  </script>
</body>
</html>
